<!DOCTYPE html>
<html webkus-version="3.4" lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[$ .Website.Name $]</title>
  <meta name="description" content="[$ .Website.Description $]" />
  <meta property="og:image" content="[$ .Website.Logo $]" />
  <link rel="icon" href="[$ .Website.Logo $]" />
  <!-- Silakan ganti url Bootstrap CSS jika diperlukan -->
  <link rel="stylesheet" href="[$ .Template.BootstrapCSS $]">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root,
    [data-bs-theme="light"],
    [data-bs-theme="dark"] {
      --bs-body-bg: #050507;
      --bs-body-color: #e7e7f2;
      --bs-emphasis-color: #ffffff;
      --bs-secondary-color: #a9a9c2;
      --bs-tertiary-bg: #0b0b14;
      --bs-secondary-bg: #0d0d18;
      --bs-border-color: rgba(0, 255, 255, .18);
      --bs-card-bg: rgba(18, 18, 30, .55);
      --bs-link-color: #6ff0ff;
      --bs-link-hover-color: #9fffe9;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff2ee6;
      --neon-purple: #7c4dff;
      --neon-green: #39ff9d;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      background: #050507 !important;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      padding-right: 0 !important;
      overflow-x: hidden;
      position: relative;
    }

    h1, h2, h3, h4, h5, .h1, .h5,
    .navbar-brand,
    #site-name {
      font-family: 'Orbitron', 'Inter', sans-serif;
      letter-spacing: .3px;
    }

    /* ---------- Animated neon background blobs ---------- */
    #bg-blobs {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: #050507;
    }

    #bg-blobs span {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .45;
      mix-blend-mode: screen;
      will-change: transform;
    }

    #bg-blobs span:nth-child(1) {
      width: 42vw;
      height: 42vw;
      top: -10%;
      left: -10%;
      background: var(--neon-purple);
      animation: blobMove1 22s ease-in-out infinite alternate;
    }

    #bg-blobs span:nth-child(2) {
      width: 38vw;
      height: 38vw;
      bottom: -15%;
      right: -10%;
      background: var(--neon-cyan);
      animation: blobMove2 26s ease-in-out infinite alternate;
    }

    #bg-blobs span:nth-child(3) {
      width: 32vw;
      height: 32vw;
      top: 35%;
      left: 55%;
      background: var(--neon-pink);
      animation: blobMove3 19s ease-in-out infinite alternate;
    }

    #bg-blobs span:nth-child(4) {
      width: 26vw;
      height: 26vw;
      top: 60%;
      left: 5%;
      background: var(--neon-green);
      opacity: .3;
      animation: blobMove1 30s ease-in-out infinite alternate-reverse;
    }

    @keyframes blobMove1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(10vw, 8vh) scale(1.15); }
      100% { transform: translate(-6vw, 12vh) scale(.95); }
    }

    @keyframes blobMove2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-12vw, -6vh) scale(1.1); }
      100% { transform: translate(6vw, -10vh) scale(.9); }
    }

    @keyframes blobMove3 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-8vw, 10vh) scale(1.2); }
      100% { transform: translate(8vw, -8vh) scale(1); }
    }

    @media (min-width: 992px) {
      .container {
        max-width: 960px;
      }
    }

    main {
      min-height: calc(-38px + 100vh);
      padding-top: 90px;
    }

    h1, .h1 { font-size: 27.625px; }
    h5, .h5 { font-size: 20px; }

    /* ---------- Navbar / logo ---------- */
    #topnav {
      background: rgba(8, 8, 14, .6) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0, 240, 255, .25) !important;
      box-shadow: 0 0 25px rgba(0, 240, 255, .12);
    }

    .navbar-brand {
      font-weight: 700;
      color: #fff !important;
      text-shadow: 0 0 8px rgba(0, 240, 255, .65), 0 0 18px rgba(124, 77, 255, .35);
      display: flex;
      align-items: center;
      gap: .5rem;
      transition: text-shadow .25s ease;
    }

    .navbar-brand:hover {
      text-shadow: 0 0 12px rgba(0, 240, 255, .9), 0 0 26px rgba(255, 46, 230, .5);
    }

    #topnav-action .btn {
      line-height: 0px;
      border-radius: 10px;
    }

    #theme-toggle {
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(0, 240, 255, .3);
      color: #6ff0ff;
      transition: box-shadow .25s ease, transform .2s ease;
    }

    #theme-toggle:hover {
      box-shadow: 0 0 14px rgba(0, 240, 255, .5);
      transform: translateY(-1px);
    }

    #cart-btn {
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      border: none;
      box-shadow: 0 0 16px rgba(124, 77, 255, .45);
      transition: box-shadow .25s ease, transform .2s ease;
    }

    #cart-btn:hover {
      box-shadow: 0 0 24px rgba(0, 240, 255, .7);
      transform: translateY(-1px);
    }

    .close-product {
      position: absolute;
      right: 0;
      margin-right: 10px;
      margin-top: 10px;
    }

    /* ---------- Generic card / surface styling ---------- */
    .card,
    .bg-body,
    .bg-body-tertiary,
    .bg-body-secondary,
    .accordion-item,
    .toast,
    .modal-content {
      background: rgba(16, 16, 26, .55) !important;
      border: 1px solid rgba(0, 240, 255, .14) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .card {
      border-radius: 16px !important;
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }

    #hero {
      box-shadow: 0 0 40px rgba(124, 77, 255, .12);
    }

    #site-logo {
      width: 70px;
      height: 70px;
      border: 2px solid rgba(0, 240, 255, .5);
      box-shadow: 0 0 18px rgba(0, 240, 255, .5), 0 0 34px rgba(255, 46, 230, .25);
      animation: logoPulse 4s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 14px rgba(0, 240, 255, .45), 0 0 26px rgba(255, 46, 230, .2); }
      50% { box-shadow: 0 0 22px rgba(0, 240, 255, .75), 0 0 40px rgba(255, 46, 230, .4); }
    }

    #site-description {
      white-space: pre-line;
      color: var(--bs-secondary-color);
    }

    .contact-btn {
      border-radius: 12px !important;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .contact-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 14px rgba(0, 240, 255, .45);
    }

    /* ---------- Buttons ---------- */
    .btn-primary {
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)) !important;
      border: none !important;
      box-shadow: 0 0 14px rgba(124, 77, 255, .4);
      transition: box-shadow .25s ease, transform .2s ease;
    }

    .btn-primary:hover {
      box-shadow: 0 0 22px rgba(0, 240, 255, .65);
      transform: translateY(-1px);
    }

    .btn-outline-primary {
      color: #6ff0ff !important;
      border-color: rgba(0, 240, 255, .5) !important;
      transition: box-shadow .25s ease, background .25s ease;
    }

    .btn-outline-primary:hover {
      background: rgba(0, 240, 255, .08) !important;
      box-shadow: 0 0 14px rgba(0, 240, 255, .35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, .06) !important;
      border: 1px solid rgba(255, 255, 255, .15) !important;
    }

    /* ---------- Product slider ---------- */
    #products-header h2 {
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 240, 255, .35);
    }

    #products-list.row {
      display: flex !important;
      flex-wrap: nowrap !important;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scroll-behavior: smooth;
      padding-bottom: 10px;
      -ms-overflow-style: none;
      scrollbar-width: none;
      mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    }

    #products-list.row::-webkit-scrollbar {
      display: none;
    }

    #products-list .product-item-wrapper {
      flex: 0 0 auto;
      width: 190px;
      scroll-snap-align: start;
    }

    @media (min-width: 768px) {
      #products-list .product-item-wrapper {
        width: 220px;
      }
    }

    .product-item {
      border-radius: 16px !important;
      overflow: hidden;
      height: 100%;
    }

    .product-item:hover {
      transform: translateY(-6px);
      border-color: rgba(0, 240, 255, .5) !important;
      box-shadow: 0 8px 28px rgba(0, 240, 255, .25);
    }

    .product-item-photo {
      aspect-ratio: 1 / 1;
      object-fit: cover;
      transition: transform .4s ease;
    }

    .product-item:hover .product-item-photo {
      transform: scale(1.08);
    }

    .product-item-name {
      color: #fff;
      font-weight: 500;
    }

    .empty-stock {
      text-shadow: 0 0 6px rgba(255, 46, 230, .5);
    }

    /* ---------- Testimonials ---------- */
    .testimonial-item {
      border-left: 3px solid var(--neon-cyan) !important;
      border-radius: 12px !important;
    }

    /* ---------- Cart / order elements ---------- */
    .cart-item-photo,
    .order-item-photo {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
    }

    .contact-icon {
      width: 18px;
      height: 18px;
    }

    #showing-product-page {
      max-height: calc(100vh - 127px);
      overflow-y: auto;
    }

    #showing-product-photo {
      width: 300px;
      height: 300px;
    }

    #showing-product-description {
      white-space: pre-line;
    }

    .order-item-note {
      white-space: pre-line;
    }

    #qris-img {
      width: 300px;
      height: 300px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 240, 255, .3);
    }

    #order-receipt pre {
      white-space: pre-line;
    }

    #img-slider .carousel-item img {
      border-radius: 14px;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050507;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      color: #6ff0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, .6);
    }
    /*
    Silakan tambahkan CSS tambahan di bawah ini.
    Setelah selesai, simpan kode CSSnya di Extended CSS pada Pengaturan Template.
    */
    /* [$ .Template.ExtendedCSS $] */
    

  </style>
</head>

<body class="bg-body-secondary">
  <div id="bg-blobs" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div id="splash-screen" class="bg-body">&nbsp;</div>
  <nav id="topnav" class="navbar container bg-body border-bottom fixed-top px-3 px-lg-4">
    <a class="navbar-brand" href="/">[$ .Website.Name $]</a>
    <div id="topnav-action" class="ms-auto">
      <button class="btn btn-outline-secondary me-2" id="theme-toggle">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon-fill"
          viewBox="0 0 16 16">
          <path
            d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278" />
        </svg>
      </button>
      <a href="/?cart=1" class="btn btn-secondary" id="cart-btn">
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart"
            viewBox="0 0 16 16">
            <path
              d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2" />
          </svg>
        </span>
        <span id="cart-count" class="small">0</span>
      </a>
    </div>
  </nav>
  <main id="app" class="container bg-body-tertiary pb-4 px-3 px-lg-4">
    <!-- HOME SECTION BEGIN -->
    <section id="home" x-data="home" x-show="show" class="d-none">
      <div class="card mb-4" id="hero">
        <div class="card-body text-center py-4">
          <img id="site-logo" src="[$ .Website.Logo $]" class="rounded-circle mb-2" alt="logo">
          <h1 id="site-name" class="mb-3">[$ .Website.Name $]</h1>
          <p id="site-description">[$ .Website.Description $]</p>
          <div id="contact-wrapper" x-data="contact" class="d-flex justify-content-center gap-2">
            <template x-for="c in urls">
              <a x-show="c" :href="c" target="_blank" rel="noopener noreferrer"
                class="contact-btn btn bg-body-tertiary border p-2 pt-0 pb-1">
                <img class="contact-icon" :src="getIcon(c)" alt="-">
              </a>
            </template>
          </div>
        </div>
      </div>
      <div id="products-wrapper">
        <div id="products-header" class="row mb-3">
          <div class="d-none d-sm-block col-sm-6">
            <h2 class="h5">Produk</h2>
          </div>
          <div class="col-sm-6">
            <div id="products-action" class="ms-auto d-flex gap-3 gap-sm-2">
              <select x-show="categories.length > 0" x-model="category" class="form-control form-control-sm" @change="changeCategory">
                <option value="">Semua Kategori</option>
                <template x-for="c in categories">
                  <option :value="c" x-text="c"></option>
                </template>
              </select>
              <input class="form-control form-control-sm" type="search" x-model="inputSearch" placeholder="Cari..">
            </div>
          </div>
        </div>
        <div x-show="isFetching" id="product-loading" class="p-3 text-center">
          <div class="spinner-grow" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <div x-show="!isFetching" id="products-list" class="row g-3 mb-4">
          <div x-show="filteredProducts.length == 0" class="col-12">
            <div id="product-not-found" class="text-center card p-3 mb-4">
              <p class="mb-0" x-text="!inputSearch ? 'Tidak ada produk' : 'Tidak ditemukan'"></p>
            </div>
          </div>
          <template x-for="product in filteredProducts">
            <div class="product-item-wrapper col-6 col-md-4 col-lg-3">
              <a :href="`?product=${product.id}`" @click="showProduct(product.id)"
                class="product-item card text-decoration-none list-group-item-action">
                <img class="product-item-photo card-img-top" :src="product.photo" alt="photo">
                <div class="card-body">
                  <div class="product-item-name mb-2" x-text="product.name"></div>
                  <div class="d-flex">
                    <div class="product-item-price">
                      <del x-show="product.discount > 0" class="text-muted small"
                        x-text="formatRp(product.price)"></del>
                      <span class="fw-bold small" x-text="formatRp(product.price - product.discount)"></span>
                    </div>
                    <div class="product-item-stock ms-auto">
                      <span x-show="product.unique_stock && product.available_stock >= 1" class="float-end small">Stok:
                        <span x-text="product.available_stock"></span></span>
                      <span x-show="product.available_stock < 1" class="empty-stock small text-danger">Habis</span>
                    </div>
                  </div>
                </div>
              </a>
            </div>
          </template>
        </div>
      </div>
      <template x-if="testimonials.length > 0">
        <div id="testimonials-wrapper">
          <h5 class="mb-3">Testimoni</h5>
          <template x-for="testimony in testimonials">
            <div class="testimonial-item card p-3 mb-2">
              <p class="testimonial-message mb-1">
                &quot;<span x-text="testimony.message"></span>&quot;
              </p>
              <p class="testimonial-sender mb-0 small">
                <span>&mdash; </span>
                <span x-text="testimony.name"></span>
              </p>
            </div>
          </template>
        </div>
      </template>
      <button data-bs-toggle="modal" data-bs-target="#showing-product" class="d-none" id="showing-product-btn"></button>
      <div class="modal fade" tabindex="-1" id="showing-product">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-body" id="showing-product-page">
              <div id="img-slider" class="carousel slide mb-4">
                <div class="carousel-inner">
                  <template x-for="photo,index in allProductImage" :key="index">
                    <div class="carousel-item" :class="{ active: index === 0 }">
                      <img :src="photo" class="d-block w-100" alt="...">
                    </div>
                  </template>
                </div>
                <button x-show="allProductImage.length > 1" class="carousel-control-prev" type="button" data-bs-target="#img-slider" data-bs-slide="prev">
                  <span class="carousel-control-prev-icon bg-dark rounded-circle" aria-hidden="true"></span>
                  <span class="visually-hidden">Previous</span>
                </button>
                <button x-show="allProductImage.length > 1" class="carousel-control-next text-dark" type="button" data-bs-target="#img-slider" data-bs-slide="next">
                  <span class="carousel-control-next-icon bg-dark rounded-circle" aria-hidden="true"></span>
                  <span class="visually-hidden">Next</span>
                </button>
              </div>
              <h5 id="showing-product-name" class="mb-0" x-text="showingProduct.name"></h5>
              <div class="d-flex mb-2 mt-3">
                <div id="showing-product-price">
                  <del x-show="showingProduct.discount > 0" class="text-muted"
                    x-text="formatRp(showingProduct.price)"></del>
                  <span class="fw-bold text-primary"
                    x-text="formatRp(showingProduct.price - showingProduct.discount)"></span>
                </div>
                <div id="showing-product-stock" x-show="showingProduct.unique_stock && showingProduct.available_stock >= 1"
                  class="small ms-auto">
                  Stok: <span x-text="showingProduct.available_stock"></span>
                </div>
              </div>
              <div id="showing-product-description" x-html="linkify(showingProduct.description)" class="mb-3"></div>
              <div id="showing-product-url" class="input-group input-group-sm">
                <input class="form-control bg-body-tertiary" :value="productURL" readonly>
                <button class="btn bg-body-tertiary border" @click="copyBtn">Salin URL</button>
              </div>
            </div>
            <button type="button" class="btn-close close-product bg-dark rounded-circle p-2" data-bs-dismiss="modal" aria-label="Close" style="z-index: 100;"></button>
            <div id="showing-product-empty" x-show="showingProduct.available_stock < 1" class="modal-body">
              <p class="text-danger text-center mb-0">Stok Habis</p>
            </div>
            <template x-if="showingProduct.available_stock > 0">
              <div id="showing-product-buy" class="d-flex p-3 gap-2">
                <button class="btn btn-outline-primary w-100" :disabled="isSending" @click="addToCart()">
                  + Keranjang <span x-text="showingProduct.available_stock"></span>
                </button>
                <button type="button" class="btn btn-primary w-100" :disabled="isSending" @click="addToCart(true)">
                  Beli Sekarang
                </button>
              </div>
            </template>
          </div>
        </div>
      </div>
      <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="social-proof-toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="toast-header">
            <strong class="me-auto">Pesanan berhasil!</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
          <div class="toast-body">
            <strong x-text="socialProofShowing.name"></strong>
            <span>baru membeli</span>
            <a :href="'/?product='+socialProofShowing.product_id">
              <span x-text="socialProofShowing.description"></span>
            </a>
            <br>
            <small class="text-body-secondary">beberapa waktu lalu</small>
          </div>
        </div>
      </div>
    </section>
    <!-- HOME SECTION END -->
    <!-- CART SECTION BEGIN -->
    <section id="cart" x-data="cart" x-show="show" class="d-none">
      <div id="cart-header" class="d-flex mb-3">
        <h5 class="">Keranjang</h5>
        <div class="ms-auto">
          <a href="/" class="btn btn-sm bg-body border">&larr; Beranda</a>
        </div>
      </div>
      <div x-show="isFetching" id="cart-loading" class="p-3 text-center">
        <div class="spinner-grow" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <div x-show="!isFetching" id="cart-wrapper" class="row g-3">
        <div x-show="carts.length == 0" class="col-12">
          <div id="cart-empty" class="card text-center p-3">
            Keranjang masih kosong
          </div>
        </div>
        <div x-show="carts.length > 0" id="cart-list" class="col-md-7">
          <template x-for="c,i in carts">
            <div class="cart-list-item card p-3 mb-2">
              <div class="d-flex">

  <script>
    const html = document.documentElement;
    const toggle = document.getElementById('theme-toggle');

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      html.setAttribute('data-bs-theme', savedTheme);
    }

    toggle.addEventListener('click', () => {
      const current = html.getAttribute('data-bs-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';

      html.setAttribute('data-bs-theme', next);
      localStorage.setItem('theme', next);
    });

    document.addEventListener("DOMContentLoaded", function () {
      const modalEl = document.getElementById("showing-product");
      const modal = new bootstrap.Modal(modalEl);

      modalEl.addEventListener("shown.bs.modal", function () {
        history.pushState({ modalOpen: true }, "");
      });

      window.addEventListener("popstate", function (event) {
        if (modalEl.classList.contains("show")) {
          modal.hide();
        }
      });

      modalEl.addEventListener("hidden.bs.modal", function () {
        if (history.state && history.state.modalOpen) {
          history.back();
        }
      });
    });
  </script>
  <script>
    const API_URL = location.origin;
    const qs = new URLSearchParams(window.location.search)
    const productId = qs.get('product')
    const orderId = qs.get('order')
    const isCartPage = qs.get('cart')
    if (orderId || isCartPage) {
      document.getElementById('hero').classList.add('d-none')
    }

    const contactURLs = '[$ .ContactURLs $]'
    const contact = {
      urls: contactURLs.split(','),
      getIcon(u) {
        let host = ''
        try {
          const url = new URL(u);
          host = url.host
        } catch (e) { }
        return 'https://icon.horse/icon/' + host
      }
    }

    function formatRp(int) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0,
      }).format(int)
    }
    function linkify(text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text ? text.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener">$1</a>') : '';
    }

    const home = {
      show: !Boolean(orderId || isCartPage),
      init() {
        if (!this.show) return
        document.getElementById('home').classList.toggle('d-none')
        this.getProducts()
      },
      products: [],
      inputSearch: '',
      category: '',
      get filteredProducts() {
        const self = this
        return this.products.filter(v => {
          const matchesCategory = self.category ? v.category == self.category : true
          const matchesSearch = v.name.toLowerCase().includes(self.inputSearch.toLowerCase())
          return matchesCategory && matchesSearch
        })
      },
      testimonials: [],
      socialProofs: [],
      categories: [],
      localId: localStorage.local_id || '-',
      showTesti: false,
      showingProduct: {},
      get productURL() {
        return location.origin + '/?product=' + this.showingProduct.id
      },
      get allProductImage() {
        return [this.showingProduct.photo, ...(this.showingProduct.more_photos || [])]
      },
      form: {
        product_id: '',
        message: ''
      },
      socialProofShowingIndex: 0,
      get socialProofShowing() {
        return this.socialProofs[this.socialProofShowingIndex] || {}
      },
      isSending: false,
      isFetching: true,
      getProducts() {
        const self = this
        self.isFetching = true
        fetch(API_URL + '/api/get-data/' + self.localId).then(res => res.json()).then(res => {
          self.products = res.products
          self.testimonials = res.testimonials
          self.socialProofs = res.social_proofs
          self.categories = [...new Set(res.products.map(p => p.category).filter(c => c))]
          document.getElementById('cart-count').innerText = res.cart_count
          if (self.localId == '' || self.localId == '-') {
            localStorage.setItem('local_id', res.local_id || '-')
            self.localId = res.local_id || '-'
          }
          self.parseQueryParams()
          if (self.socialProofs.length > 0) {
            self.showToast()
          }
          self.isFetching = false
        })
      },
      parseQueryParams() {
        if (productId) {
          this.showProduct(productId)
        }
      },
      showProduct(id) {
        event && event.preventDefault()
        const p = this.products.find(p => p.id == id)
        this.showingProduct = p
        document.getElementById('showing-product-btn').click()
      },
      copyBtn() {
        navigator.clipboard.writeText(this.productURL)
        const el = event.target
        el.classList.toggle('text-success')
        el.innerText = 'Tersalin'
        setTimeout(() => {
          el.classList.toggle('text-success')
          el.innerText = 'Salin URL'
        }, 1000)
      },
      addToCart(buyNow = false) {
        const self = this
        self.form.product_id = self.showingProduct.id
        self.isSending = true
        fetch(API_URL + '/api/carts/' + self.localId, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(this.form)
        }).then(res => res.json()).then(res => {
          if (buyNow) {
            location.href = '?cart=1'
          } else {
            document.getElementById('cart-count').innerText = res.cart_count
            document.querySelector('.close-product').click()
            self.isSending = false
          }
        })
        .catch(e => {
          console.error(e)
          self.isSending = false
        })
      },
      showToast() {
        const toastEl = document.getElementById('social-proof-toast')
        const toast = new bootstrap.Toast(toastEl)
        setTimeout(() => {
          toast.show()
        }, 5_000);
        setInterval(() => {
          this.socialProofShowingIndex = (this.socialProofShowingIndex + 1) % this.socialProofs.length
          toast.show()
        }, 15_000)
      }
    }

    const cart = {
      show: isCartPage,
      init() {
        if (!this.show) return
        document.getElementById('cart').classList.toggle('d-none')
        this.getCarts()
      },
      carts: [],
      form: {
        name: localStorage.order_name || '',
        email: localStorage.order_email || '',
        phone: localStorage.order_phone || '',
      },
      isSending: false,
      get isValid() {
        return this.form.name && this.form.email
      },
      get total() {
        return this.carts.reduce((acc, v) => {
          return acc + ((v.product.price - v.product.discount) * v.quantity)
        }, 0)
      },
      localId: localStorage.local_id || '-',
      isFetching: true,
      getCarts() {
        const self = this
        self.isFetching = true
        fetch(API_URL + '/api/carts/' + self.localId).then(res => res.json()).then(res => {
          self.carts = res.carts
          document.getElementById('cart-count').innerText = res.carts.length
          self.isFetching = false
        })
      },
      updateMessage(i) {
        const c = this.carts[i]
        const self = this
        self.isSending = true
        fetch(API_URL + '/api/carts/' + self.localId + '/' + c.id, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: c.message
          })
        }).then(res => res.json()).then(res => {
          self.isSending = false
        })
          .catch(e => {
            console.error(e)
            self.isSending = false
          })
      },
      removeBtn(id) {
        const self = this
        self.isSending = true
        fetch(API_URL + '/api/carts/' + self.localId + '/' + id, {
          method: 'DELETE',
        }).then(res => res.json()).then(res => {
          if (res.message) {
            alert(res.message)
            self.isSending = false
            return
          }
          location.reload()
        })
          .catch(e => {
            console.error(e)
            self.isSending = false
          })
      },
      addBtn(id) {
        const self = this
        self.isSending = true
        fetch(API_URL + '/api/carts/' + self.localId, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ product_id: id })
        }).then(res => res.json()).then(res => {
          if (res.message) {
            alert(res.message)
            self.isSending = false
            return
          }
          location.reload()
        })
          .catch(e => {
            console.error(e)
            self.isSending = false
          })
      },
      checkoutBtn() {
        const self = this
        self.isSending = true
        fetch(API_URL + '/api/checkout/' + self.localId, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(this.form)
        }).then(res => res.json()).then(res => {
          if (res.message) {
            alert(res.message)
            self.isSending = false
            return
          }
          localStorage.setItem('order_name', self.form.name)
          localStorage.setItem('order_email', self.form.email)
          localStorage.setItem('order_phone', self.form.phone)
          location.href = '/?order=' + res.order.id
        })
          .catch(e => {
            console.error(e)
            self.isSending = false
          })
      }
    }

    const order = {
      show: Boolean(orderId),
      init() {
        if (!this.show) return
        document.getElementById('order').classList.toggle('d-none')
        this.getOrder()
      },
      order: {},
      agree: false,
      localId: localStorage.local_id || '-',
      error: '',
      via: 'qris',
      isSending: false,
      get product() {
        return this.order.product || {}
      },
      get fee() {
        if (this.via == 'bank') {
          return this.order.va_fee
        }
        return this.order.fee
      },
      get totalPayment() {
        if (this.via == 'bank') {
          return this.order.va_total_payment
        }
        return this.order.total_payment
      },
      isFetching: true,
      getOrder() {
        const self = this
        self.isFetching = true
        fetch(API_URL + '/api/orders/' + orderId + '?local_id=' + this.localId).then(res => res.json()).then(res => {
          document.getElementById('cart-count').innerText = res.cart_count || ''
          if (!res.order) {
            self.error = 'Pesanan tidak ditemukan'
            return
          }
          self.order = res.order
          self.isFetching = false
          self.showQR()
          if (self.order.status == 'completed') {
            self.showReceipt()
          }
        }).catch(e => {
          console.log(e)
          self.error = 'Terjadi kesalahan'
          self.isFetching = false
        })
      },
      showReceipt() {
        setTimeout(() => {
          document.getElementById('order-receipt').innerHTML = marked.parse(this.order.receipt || '')
        }, 500);
      },
      formatDateTime(date) {
        if (!date) return '-'
        return new Intl.DateTimeFormat('id-ID', {
          dateStyle: 'medium',
          timeStyle: 'short',
        }).format(new Date(date))
      },
      copyVa() {
        const el = event.target
        navigator.clipboard.writeText(this.order.va_number)
        el.classList.toggle('text-success')
        el.innerHTML = '&check; Tersalin'
        setTimeout(() => {
          el.classList.toggle('text-success')
          el.innerHTML = 'Salin'
        }, 1000)
      },
      showQR() {
        const self = this
        var qrPng = QRCode.generatePNG(this.order.qr_string, {
          ecclevel: "M",
          format: "html",
          margin: 2,
          modulesize: 8
        });
        self.order.qr_img_data = qrPng
      }
    }

    window.showImmediately = true

    // Silakan tambahkan script tambahan di daerah sini.
    // Setelah selesai, simpan script tersebut di Extended JS pada Pengaturan Template.

    /* [$ .Template.ExtendedJS $] */


    document.addEventListener('alpine:init', () => {
      if (window.showImmediately) {
        document.getElementById('splash-screen').style.display = 'none'
      }
    })

  </script>
  <!-- Script tambahan khusus efek auto-slide produk (visual saja, tidak menyentuh logika Alpine di atas) -->
  <script>
    (function () {
      function initAutoSlide() {
        const list = document.getElementById('products-list');
        if (!list) return;

        let direction = 1;
        let paused = false;
        let timer = null;

        function tick() {
          if (paused || !list || list.scrollWidth <= list.clientWidth) return;
          const maxScroll = list.scrollWidth - list.clientWidth;
          let next = list.scrollLeft + direction * 1.2;
          if (next >= maxScroll) {
            next = maxScroll;
            direction = -1;
          } else if (next <= 0) {
            next = 0;
            direction = 1;
          }
          list.scrollLeft = next;
        }

        list.addEventListener('mouseenter', () => { paused = true; });
        list.addEventListener('mouseleave', () => { paused = false; });
        list.addEventListener('touchstart', () => { paused = true; }, { passive: true });
        list.addEventListener('touchend', () => { setTimeout(() => paused = false, 2000); });

        timer = setInterval(tick, 16);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAutoSlide);
      } else {
        initAutoSlide();
      }

      // #products-list baru dirender ulang oleh Alpine setiap fetch produk selesai,
      // observer ini memastikan auto-slide tetap jalan meski elemen berubah isi.
      const observer = new MutationObserver(() => {});
      const target = document.getElementById('app');
      if (target) observer.observe(target, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
